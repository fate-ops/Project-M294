<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aufgabenliste</title>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <h1>Aufgabenliste - Useini</h1>
    <form name="login" id="login" method="post">
      <h4>Anmeldung:</h4>
      <label for="mail">E-Mail: </label>
      <input
        type="email"
        id="mail"
        required
        placeholder="beispiel@skibidi.com"
      />
      <br />
      <label for="passwd">Passwort:</label>
      <input type="password" id="passwd" required />
      <br />
      <button type="submit" id="sub">Bestätigen</button>
      <br />
    </form>

    <form name="create-task" id="create-task" method="post">
      <label for="title">Aufgabe:</label>
      <textarea id="title" required></textarea>
      <br />
      <button type="submit" id="submitTask">Hinzufügen</button>
    </form>

    <ul id="task-list"></ul>
  </body>
</html>
